name: ebook_reader
description: A professional Flutter e-book reader with text-to-speech and read-along highlighting.
publish_to: 'none' # We are not publishing this to pub.dev, it's a private app.
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # google_fonts: lets us use professional, non-default typefaces (Poppins,
  # Inter) without manually bundling .ttf font files. Official Flutter
  # Favorite package, actively maintained by the Flutter ecosystem team.
  google_fonts: ^6.2.1

  # cupertino_icons: ships by default with every new Flutter project, gives
  # access to iOS-style icons in addition to Material icons. Kept for
  # compatibility even though this app targets Android first.
  cupertino_icons: ^1.0.8

  # file_picker: lets the user open their device's NATIVE file picker
  # (Android's Storage Access Framework) and hand us back a real file's
  # path, name, size, and extension. This is the de-facto standard file
  # picking package in the Flutter ecosystem — verified publisher,
  # actively maintained, 2.88M+ downloads. Latest STABLE release used
  # intentionally (not the 12.0.0 beta).
  file_picker: ^11.0.2

  # provider: shares reader state (the loaded book content now; playback
  # and highlighting state from Module 4 onward) across multiple widgets
  # in the Reader screen's subtree without threading it through every
  # constructor by hand. Flutter Favorite, verified publisher, and still
  # the Flutter team's own documented starting point for state management
  # (docs.flutter.dev/data-and-backend/state-mgmt/simple).
  provider: ^6.1.5+1

  # flutter_tts: reads book content aloud using each platform's own native
  # engine (Android TextToSpeech / iOS AVSpeechSynthesizer). Verified
  # publisher, actively maintained (latest stable release 4.2.5, MIT
  # licensed, 1.58k+ likes). Chosen specifically because it's the only
  # Flutter TTS package with genuine start/pause/completion/error/cancel
  # callbacks across Android and iOS — exactly the event model Module 4's
  # playback state machine is built on, and the same callback family
  # Module 5's word highlighting extends.
  flutter_tts: ^4.2.5

  # shared_preferences: persists reading progress (which book, how far
  # into it) across app restarts. Published by the Flutter team itself
  # (flutter.dev, verified publisher), 10.5k+ likes. Using the modern
  # `SharedPreferencesAsync` API specifically — the package's own docs
  # now flag the older `SharedPreferences.getInstance()` singleton API as
  # legacy and slated for future deprecation, in favor of this one.
  shared_preferences: ^2.5.5

  # path_provider: gives access to a directory the OS guarantees this
  # app owns and won't clear out from under it (getApplicationDocuments
  # Directory) — published by the Flutter team itself (flutter.dev,
  # verified publisher), 5.5k+ likes, actively maintained. This is what
  # makes a genuinely persistent library possible: file_picker's own
  # returned path is a transient cache copy (see BookFile.identityKey's
  # doc comment for the bug that taught us this) — Module 8 copies each
  # imported book's bytes into a path_provider-managed directory exactly
  # once, so the library keeps working even if the original source file
  # is later deleted, moved, or the picker's own cache is cleared.
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  # flutter_lints: Google's official, recommended set of lint rules for
  # Flutter projects. It catches common mistakes (unused imports, missing
  # `const`, etc.) before they become bugs. Every production Flutter repo
  # should have this.
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Asset folders will be used starting Module 2 (e.g. placeholder cover
  # images). Declared now so the folder structure is ready.
  assets:
    - assets/images/
